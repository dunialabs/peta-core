services:
  postgres:
    image: postgres:16-alpine
    container_name: peta-core-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: peta
      POSTGRES_PASSWORD: peta123
      POSTGRES_DB: peta_mcp_gateway
    ports:
      - '${PETA_POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U peta -d peta_mcp_gateway']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - peta-core-network

  peta-auth:
    image: petaio/peta-auth:${PETA_AUTH_VERSION:-1.3.0}
    container_name: peta-auth
    restart: unless-stopped
    profiles: [auth]
    environment:
      PETA_AUTH_MASTER_KEY_FILE: /run/secrets/peta_auth_master_key
      PETA_AUTH_CLIENT_SECRETS_FILE: /run/secrets/peta_auth_client_secrets_json
    secrets:
      - peta_auth_master_key
      - peta_auth_client_secrets_json
    networks:
      - peta-core-network
    volumes:
      - peta-auth-data:/data
    healthcheck:
      test: ['CMD', '/usr/bin/bash', '-c', 'exec 3<>/dev/tcp/localhost/7788 || exit 1; printf "GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; response=""; while IFS= read -r -t 2 line <&3; do response+="$$line"; done; [[ "$$response" == *"\"ok\":true"* ]]']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Peta Core service (uncomment when deploying)
  # peta-core:
  #   image: petaio/peta-core:${PETA_VERSION:-1.3.0}
  #   container_name: peta-core
  #   restart: unless-stopped
  #   ports:
  #     - '${BACKEND_PORT:-3002}:3002'
  #   environment:
  #     - DATABASE_URL=postgresql://peta:peta123@postgres:5432/peta_mcp_gateway?schema=public
  #     - SKILLS_DIR=/data/skills
  #   volumes:
  #     - ./skills:/data/skills    # Skills directory (shared with skillsmcp)
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - peta-core-network

  # Skills MCP server (uncomment when deploying)
  # skillsmcp:
  #   image: ghcr.io/dunialabs/mcp-servers/mcp-skills:1.0.0
  #   container_name: peta-skillsmcp
  #   restart: unless-stopped
  #   environment:
  #     - SKILLS_DIR=/app/skills
  #   volumes:
  #     - ./skills:/app/skills:ro  # Read-only mount of same skills directory
  #   networks:
  #     - peta-core-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: peta-core-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      - peta-core-network
    volumes:
      - ./cloudflared:/etc/cloudflared

volumes:
  postgres_data:
    driver: local
  peta-auth-data:
    driver: local

secrets:
  peta_auth_master_key:
    file: ${PETA_AUTH_MASTER_KEY_SOURCE:-./secrets/peta_auth_master_key}
  peta_auth_client_secrets_json:
    file: ${PETA_AUTH_CLIENT_SECRETS_SOURCE:-./secrets/peta_auth_client_secrets.json}

networks:
  peta-core-network:
    driver: bridge
